# GitLab CI/CD Pipeline 配置 - 简化版
# 转换自 GitHub Actions workflows

stages:
  - test
  - render
  - deploy

variables:
  PYTHON_VERSION: "3.9"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# 缓存配置
cache:
  paths:
    - .cache/pip/
    - venv/

# 基础测试任务
test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "🚀 开始运行测试..."
    - python test_render.py
    - echo "🔍 验证项目结构..."
    - |
      for dir in templates envs scripts; do
        if [ ! -d "$dir" ]; then
          echo "❌ $dir 目录不存在"
          exit 1
        fi
      done
      echo "✅ 项目结构验证通过"
    - echo "🔍 检查代码语法..."
    - python -m py_compile test_render.py
    - python -m py_compile scripts/render_templates.py
    - echo "✅ 代码语法检查通过"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# 渲染模板任务
render:
  stage: render
  image: python:${PYTHON_VERSION}
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "🎨 开始渲染模板..."
    - |
      # 验证JSON配置文件
      for config_file in envs/*.json; do
        if [ -f "$config_file" ]; then
          echo "验证 $config_file"
          python -m json.tool "$config_file" > /dev/null || exit 1
        fi
      done
    - |
      # 根据分支渲染模板
      if [ "$CI_COMMIT_REF_NAME" = "dev" ] || [ "$CI_COMMIT_REF_NAME" = "sit" ] || [ "$CI_COMMIT_REF_NAME" = "master" ]; then
        echo "渲染 $CI_COMMIT_REF_NAME 分支模板..."
        python scripts/render_templates.py --branch $CI_COMMIT_REF_NAME --debug
      else
        echo "渲染所有分支模板..."
        python scripts/render_templates.py --all --debug
      fi
    - |
      # 验证生成的文件
      if [ -d "rendered" ]; then
        echo "=== 渲染结果 ==="
        for branch_dir in rendered/*/; do
          if [ -d "$branch_dir" ]; then
            branch_name=$(basename "$branch_dir")
            file_count=$(find "$branch_dir" -name "*.py" | wc -l)
            echo "分支 $branch_name: $file_count 个文件"
            
            # 验证Python语法
            for py_file in "$branch_dir"*.py; do
              if [ -f "$py_file" ]; then
                python -m py_compile "$py_file"
              fi
            done
          fi
        done
      else
        echo "没有生成渲染文件"
      fi
  artifacts:
    name: "rendered-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - rendered/
    expire_in: 30 days
  needs: ["test"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_REF_NAME == "dev" || $CI_COMMIT_REF_NAME == "sit" || $CI_COMMIT_REF_NAME == "master")
      changes:
        - "templates/**/*.j2"
        - "envs/*.json"
    - if: $CI_PIPELINE_SOURCE == "web"

# 部署任务（可选）
deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "📦 部署渲染结果..."
    - |
      if [ -d "rendered" ]; then
        echo "✅ 部署完成"
        echo "分支: $CI_COMMIT_REF_NAME"
        echo "提交: $CI_COMMIT_SHA"
        echo "时间: $(date)"
      else
        echo "❌ 没有找到渲染文件"
        exit 1
      fi
  needs: ["render"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "master"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual